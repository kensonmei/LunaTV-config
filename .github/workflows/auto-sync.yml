name: Auto-Sync Upstream & Merge

on:
  schedule:
    - cron: '17 7 * * *'  # daily at 7:17 UTC
  workflow_dispatch:        # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch upstream jingjian.json
        run: |
          curl -sL -o upstream.json \
            "https://raw.githubusercontent.com/hafrey1/LunaTV-config/refs/heads/main/jingjian.json"

      - name: Merge & regenerate
        run: node scripts/merge-upstream.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jingjian.json jingjian.txt jingjian-adult.json jingjian-adult.txt
          if git diff --staged --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "Auto-sync: merge upstream $(date +%Y-%m-%d)"
            git push
            echo "Committed and pushed."
          fi
